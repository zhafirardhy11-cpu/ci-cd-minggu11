name: CI
 
on:
  push:
    branches: [main]
  pull_request:
 
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v6
      - name: Pasang Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Pasang pytest
        run: pip install pytest
      - name: Jalankan tes
        run: pytest -v
 
  docker-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v6
      - name: Build image Docker
        run: docker build -t kalkulator:ci .
      - name: Uji jalankan image
        run: docker run --rm kalkulator:ci

